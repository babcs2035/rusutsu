services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rusutsu-app
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://rusutsu:rusutsu@db:5432/rusutsu
      - TZ=Asia/Tokyo
      - APP_PORT=${APP_PORT:-3000}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: rusutsu-db
    environment:
      POSTGRES_USER: rusutsu
      POSTGRES_PASSWORD: rusutsu
      POSTGRES_DB: rusutsu
      TZ: Asia/Tokyo
      DB_PORT: ${DB_PORT:-5432}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rusutsu -d rusutsu"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
