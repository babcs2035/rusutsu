services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rusutsu-app
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://rusutsu:rusutsu@db:5432/rusutsu
      - TZ=Asia/Tokyo
      - APP_PORT=${APP_PORT:-3000}
      - AUTH_SECRET=${AUTH_SECRET}
      - AUTH_URL=${AUTH_URL}
      - AUTH_TRUST_HOST=${AUTH_TRUST_HOST}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - ADMIN_EMAILS=${ADMIN_EMAILS}
      - INTERNAL_DATA_API_ADMIN_TOKEN=${INTERNAL_DATA_API_ADMIN_TOKEN}
      - INTERNAL_DATA_API_CRAWLER_TOKEN=${INTERNAL_DATA_API_CRAWLER_TOKEN}
      - INTERNAL_DATA_API_DIAGNOSTICS_TOKEN=${INTERNAL_DATA_API_DIAGNOSTICS_TOKEN}
      - CRAWLER_ARTIFACT_ROOT=/app/var/crawler-artifacts
      - CRAWLER_ARTIFACT_RETENTION_DAYS=${CRAWLER_ARTIFACT_RETENTION_DAYS:-30}
    volumes:
      - crawler_artifacts:/app/var/crawler-artifacts
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "node", "scripts/ops/check-readiness.mjs"]
      interval: 15s
      timeout: 20s
      start_period: 30s
      retries: 6
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: rusutsu-db
    environment:
      POSTGRES_USER: rusutsu
      POSTGRES_PASSWORD: rusutsu
      POSTGRES_DB: rusutsu
      TZ: Asia/Tokyo
      DB_PORT: ${DB_PORT:-5432}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rusutsu -d rusutsu"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  crawler_artifacts:
