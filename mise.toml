[tools]
node = "24.19.0"
"npm:pnpm" = "11.20.0"

[tasks]
# --- Project Setup ---
setup = { description = "プロジェクトの初期セットアップ（依存関係、DB、シード）", run = [
  "cp -n .env.example .env || true",
  "pnpm install",
  "pnpm exec playwright install chromium",
  "docker compose up -d --wait db",
  "mise run db:migrate",
  "mise run db:generate",
  "mise run db:seed"
]}

# --- Development ---
dev = { description = "開発サーバー起動（このMacからだけ接続可能）", run = "pnpm dev" }
"dev:lan" = { description = "開発サーバー起動（LANへ明示的に公開）", run = "pnpm dev:lan" }
format = { description = "Format (Biome)", run = "pnpm format" }
lint = { description = "Lint (Biome)", run = "pnpm lint" }
test = { description = "全テスト（本番接続なし）", run = "pnpm test" }
typecheck = { description = "型チェック", run = "pnpm typecheck" }
check = { description = "コード品質チェック (Format, Lint, TypeCheck)", run = ["mise run format", "mise run lint", "mise run typecheck"] }

# --- Build ---
build = { description = "プロダクションビルド", run = "pnpm build" }
start = { description = "プロダクションサーバー起動", run = "pnpm start" }

# --- Database (Prisma) ---
"db:up" = { description = "DBコンテナ起動", run = "docker compose up -d --wait db" }
"db:down" = { description = "app/DBコンテナとnetworkを停止（volumeは保持）", run = "docker compose down" }
"db:studio" = { description = "Prisma Studio 起動", run = "pnpm prisma studio" }
"db:migrate" = { description = "マイグレーション実行", run = "pnpm prisma migrate dev" }
"db:generate" = { description = "Prisma Client 生成", run = "pnpm prisma generate" }
"db:seed" = { description = "DB シード実行（接続確認のみ）", run = "pnpm prisma db seed" }
"db:import-documents" = { description = "初回文書移行（--dry-run / --initialize を明示）", run = "node --import tsx scripts/importCanonicalDataDocuments.ts" }
"db:import-short-names" = { description = "短縮名の初回移行（--dry-run / --initialize を明示）", run = "node --import tsx scripts/importSkiResortShortNames.ts" }
"db:reset" = { description = "DB リセット（全データ削除 & シード）", run = "pnpm prisma migrate reset --force" }

# --- Crawling ---
"crawl:ski-areas" = { description = "基本情報 (SkiAreas) の更新", run = "pnpm tsx src/private/scripts/crawlSkiAreas.ts" }
"crawl:gelendes" = { description = "詳細情報 (Gelendes) の更新", run = "pnpm tsx src/private/scripts/crawlGelendes.ts" }
"crawl:weathers" = { description = "天気 (Weathers) の更新", run = "pnpm tsx src/private/scripts/crawlWeathers.ts" }
"crawl:forecasts" = { description = "予報 (Forecasts) の更新", run = "pnpm tsx src/private/scripts/crawlForecasts.ts" }
"crawl:latest" = { description = "スキー場別crawl_latestを一括または個別実行", run = "node --import tsx scripts/runCrawlLatestBatch.ts" }

"crawl:all" = { description = "全データのクローリング実行", run = [
  "mise run crawl:ski-areas",
  "mise run crawl:gelendes",
  "mise run crawl:weathers",
  "mise run crawl:forecasts",
  "pnpm tsx src/private/scripts/crawlSnowDepths.ts",
  "pnpm tsx src/private/scripts/crawlSnowFalls.ts",
  "pnpm tsx src/private/scripts/crawlLatestReports.ts",
  "pnpm tsx src/private/scripts/crawlYukiMagi.ts",
  "pnpm tsx src/private/scripts/crawlAmedas.ts"
]}
"crawl:diagnostics:pull" = { description = "本番APIから警告・失敗DOMをVS Code用に取得", run = "pnpm tsx scripts/pullCrawlerDiagnostics.ts" }

# --- データ検証 ---
"merge:resort-sheets" = { description = "resorts の Excel を before と既存の 10m/20m GeoJSON へ統合", run = "node --import tsx scripts/mergeResortSheetsIntoGeojson.ts" }
"validate:map-data" = { description = "自己完結したコース・リフト GeoJSON と営業状況の結合データを検証", run = "pnpm tsx scripts/validateResortMapData.ts" }
"report:sheet-links" = { description = "resorts の Excel と地図の線の突き合わせ結果を CSV に書き出す", run = "pnpm tsx scripts/reportResortSheetLinks.ts" }
"validate:map-data:strict" = { description = "同上。❌ が 1 件でもあれば異常終了する", run = "pnpm tsx scripts/validateResortMapData.ts --strict" }

# --- Docker ---
"docker:logs" = { description = "コンテナログ表示", run = "docker compose logs -f" }
"docker:build" = { description = "コンテナ再構築", run = "docker compose up -d --build" }

# --- Utility ---
clean = { description = "一時ファイル削除 (node_modules, .next)", run = "rm -rf node_modules .next" }
