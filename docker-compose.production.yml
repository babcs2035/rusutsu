services:
  app:
    image: ghcr.io/babcs2035/rusutsu:latest
    container_name: rusutsu-app
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-rusutsu}:${POSTGRES_PASSWORD:-rusutsu}@db:5432/${POSTGRES_DB:-rusutsu}
      - TZ=Asia/Tokyo
      - PORT=${PORT:-3000}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: rusutsu-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rusutsu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rusutsu}
      POSTGRES_DB: ${POSTGRES_DB:-rusutsu}
      TZ: Asia/Tokyo
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rusutsu} -d ${POSTGRES_DB:-rusutsu}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
