name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      initialize_data:
        description: "Run the one-time canonical documents and shortName imports"
        type: boolean
        default: false
      force_database_backup:
        description: "Require a backup for an explicit bulk database operation"
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io

jobs:
  ci-checks:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine@sha256:1d5b02d3a9941fbd52437db4107f8c52d6297dac553ca1e5c299ebb3756b4857
        env:
          POSTGRES_USER: rusutsu_ci
          POSTGRES_PASSWORD: ephemeral_ci_only
          POSTGRES_DB: rusutsu_test_1
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rusutsu_ci -d rusutsu_test_1"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://rusutsu_ci:ephemeral_ci_only@localhost:5432/rusutsu_test_1
      TEST_DATABASE_URL: postgresql://rusutsu_ci:ephemeral_ci_only@localhost:5432/rusutsu_test_1

    steps:
      - name: Checkout repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # main
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_TOKEN }}

      - name: Setup mise
        uses: jdx/mise-action@bfe96ab3315135bc9f7bf94c40e84f9f5efed861 # main
        with:
          install: true

      - name: Prepare environment variables
        run: cp .env.example .env

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: mise run db:generate

      - name: Check formatting, lint, and types
        run: mise run check

      - name: Install Playwright browser for DOM tests
        run: pnpm exec playwright install --with-deps --only-shell chromium

      - name: Unit and contract tests
        run: mise run test -- --unit

      - name: Database integration tests on the shared disposable database
        run: mise run test -- --db

      - name: Verify collected lift ticket data against official expectations
        run: LIFT_TICKET_DATA_ROOT=src/private/data/lift-ticket mise run test -- --unit src/features/lift-ticket/utils/uiContract.test.ts

      - name: Reject schema changes missing a migration
        run: pnpm prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

      - name: Validate deployment scripts
        run: |
          for script in scripts/ops/*.sh; do bash -n "$script" || exit; done
          python3 -m py_compile scripts/ops/build-db-manifest.py
          docker compose config --quiet
          git diff --check

  build-and-push:
    name: Build and Push Image
    needs: ci-checks
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # main
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_TOKEN }}

      - name: Setup mise
        uses: jdx/mise-action@bfe96ab3315135bc9f7bf94c40e84f9f5efed861 # main
        with:
          install: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@5138f26214adf9d69718655df70f66d2b3c81db3 # master

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bf8388060db527dff14f48b6a5fdbe70763c1213 # master
        with:
          driver-opts: image=moby/buildkit:latest@sha256:baf6138eb8c37644800c7c913fba051e840ebb9ba13eaf92d92ef9a1712d0b4c

      - name: Log in to the Container registry
        uses: docker/login-action@d0b8297dd55199249f38268efae35fcb03f75aab # master
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --build-arg "RUSUTSU_CSP_ENFORCE=${{ vars.RUSUTSU_CSP_ENFORCE == 'true' }}" \
            --push \
            --tag "${{ env.REGISTRY }}/babcs2035/rusutsu:latest" \
            --tag "${{ env.REGISTRY }}/babcs2035/rusutsu:${{ github.sha }}" \
            --cache-from=type=gha \
            --cache-to=type=gha,mode=max \
            .

  deploy:
    name: Deploy Image to VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    concurrency:
      group: rusutsu-production-operations
      cancel-in-progress: false
    env:
      DEPLOY_IMAGE_TAG: ${{ github.sha }}
      INITIALIZE_CANONICAL_DATA: ${{ inputs.initialize_data == true || vars.INITIALIZE_CANONICAL_DATA == 'true' }}
      FORCE_DATABASE_BACKUP: ${{ inputs.force_database_backup == true }}
      ENABLE_CRAWL_LATEST_SCHEDULER: ${{ vars.ENABLE_CRAWL_LATEST_SCHEDULER != 'false' }}
      GHCR_DEPLOY_TOKEN: ${{ secrets.GHCR_DEPLOY_TOKEN }}
      GHCR_DEPLOY_USER: ${{ github.actor }}
      DEPLOY_TARGET: ${{ secrets.DEPLOY_TARGET }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # main
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_TOKEN }}

      - name: Setup Tailscale
        uses: tailscale/github-action@15aab698c4bc2ba4baecf36031adbc296b594f36 # main
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Setup mise for deployment settings
        uses: jdx/mise-action@bfe96ab3315135bc9f7bf94c40e84f9f5efed861 # main
        with:
          install: true

      - name: Prepare production settings from GitHub
        env:
          API_BEARER_TOKEN: ${{ secrets.API_BEARER_TOKEN }}
          API_BASE_URL: ${{ vars.API_BASE_URL || secrets.API_BASE_URL }}
          # Optional: otherwise preserve settings from the existing app.
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          COMMUNITY_MODERATION_URL: ${{ vars.COMMUNITY_MODERATION_URL }}
          COMMUNITY_MODERATION_TOKEN: ${{ secrets.COMMUNITY_MODERATION_TOKEN }}
          COMMUNITY_MODERATION_MODEL: ${{ vars.COMMUNITY_MODERATION_MODEL }}
          CONTRIBUTION_TRUST_PROXY: ${{ vars.CONTRIBUTION_TRUST_PROXY }}
        run: mise exec -- node scripts/ops/production-settings.ts

      - name: Fingerprint explicit database-changing paths
        run: python3 scripts/ops/build-db-manifest.py > db-change-manifest.sha256

      - name: Deploy package via SCP
        uses: appleboy/scp-action@7e85c2e09aa21988492acd66466b5d68bda49e2b # master
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          target: ${{ secrets.DEPLOY_TARGET }}
          source: "docker-compose.production.yml,db-change-manifest.sha256,scripts/ops"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@c4f70287fc37c43b14b30b407224bbbc8e8c6327 # master
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          envs: DEPLOY_IMAGE_TAG,INITIALIZE_CANONICAL_DATA,FORCE_DATABASE_BACKUP,ENABLE_CRAWL_LATEST_SCHEDULER,GHCR_DEPLOY_TOKEN,GHCR_DEPLOY_USER,DEPLOY_TARGET,RUSUTSU_SETTINGS_B64
          command_timeout: 30m
          script: |
            set -eu
            # A quoted variable does not expand ~/ like the SCP target does.
            case "${DEPLOY_TARGET:-}" in
              '') echo 'DEPLOY_TARGET is empty. Set the deployment directory in GitHub Secrets.' >&2; exit 1 ;;
              '~') DEPLOY_TARGET="$HOME" ;;
              '~/'*) DEPLOY_TARGET="$HOME/${DEPLOY_TARGET#\~/}" ;;
              '$HOME/'*) DEPLOY_TARGET="$HOME/${DEPLOY_TARGET#\$HOME/}" ;;
              '${HOME}/'*) DEPLOY_TARGET="$HOME/${DEPLOY_TARGET#\$\{HOME\}/}" ;;
            esac
            if ! cd -- "$DEPLOY_TARGET" 2>/dev/null; then
              echo 'DEPLOY_TARGET directory is unavailable. Check the VPS deployment path in GitHub Secrets; use an absolute path or ~/directory.' >&2
              exit 1
            fi
            if [ ! -f scripts/ops/deploy.sh ] || [ ! -f docker-compose.production.yml ] || [ ! -f db-change-manifest.sha256 ]; then
              echo 'Deployment package is missing from DEPLOY_TARGET. Check the SCP step and deployment path.' >&2
              exit 1
            fi
            printf '%s' "$GHCR_DEPLOY_TOKEN" | docker login ghcr.io -u "$GHCR_DEPLOY_USER" --password-stdin
            unset GHCR_DEPLOY_TOKEN
            bash scripts/ops/deploy.sh

      - name: Clean up verified obsolete app images
        id: image-cleanup
        continue-on-error: true
        uses: appleboy/ssh-action@c4f70287fc37c43b14b30b407224bbbc8e8c6327 # master
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          envs: DEPLOY_IMAGE_TAG,DEPLOY_TARGET
          script: |
            set -eu
            case "${DEPLOY_TARGET:-}" in
              '') echo 'DEPLOY_TARGET is empty.' >&2; exit 1 ;;
              '~') DEPLOY_TARGET="$HOME" ;;
              '~/'*) DEPLOY_TARGET="$HOME/${DEPLOY_TARGET#\~/}" ;;
              '$HOME/'*) DEPLOY_TARGET="$HOME/${DEPLOY_TARGET#\$HOME/}" ;;
              '${HOME}/'*) DEPLOY_TARGET="$HOME/${DEPLOY_TARGET#\$\{HOME\}/}" ;;
            esac
            cd -- "$DEPLOY_TARGET"
            before="$(docker system df --format '{{.Type}} {{.Reclaimable}}')"
            if ! bash scripts/ops/cleanup-images.sh; then
              echo 'Verified image cleanup failed; deployment remains active.' >&2
              exit 1
            fi
            after="$(docker system df --format '{{.Type}} {{.Reclaimable}}')"
            printf 'Docker reclaimable space before cleanup:\n%s\n' "$before"
            printf 'Docker reclaimable space after cleanup:\n%s\n' "$after"

      - name: Report image cleanup failure
        if: steps.image-cleanup.outcome == 'failure'
        run: echo '::warning title=Image cleanup failed::Deployment succeeded; obsolete image cleanup needs attention.'
