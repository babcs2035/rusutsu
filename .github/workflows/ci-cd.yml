name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      initialize_data:
        description: "Run the one-time canonical documents and shortName imports"
        type: boolean
        default: false
      rollback_image_sha:
        description: "Roll back to a previously successful app image SHA (main only)"
        type: string
        required: false

env:
  REGISTRY: ghcr.io

jobs:
  ci-checks:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine@sha256:1d5b02d3a9941fbd52437db4107f8c52d6297dac553ca1e5c299ebb3756b4857
        env:
          POSTGRES_USER: rusutsu_ci
          POSTGRES_PASSWORD: ephemeral_ci_only
          POSTGRES_DB: rusutsu_test_1
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rusutsu_ci -d rusutsu_test_1"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://rusutsu_ci:ephemeral_ci_only@localhost:5432/rusutsu_test_1
      TEST_DATABASE_URL: postgresql://rusutsu_ci:ephemeral_ci_only@localhost:5432/rusutsu_test_1

    steps:
      - name: Checkout repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # main
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_TOKEN }}

      - name: Setup mise
        uses: jdx/mise-action@bfe96ab3315135bc9f7bf94c40e84f9f5efed861 # main
        with:
          install: true

      - name: Prepare environment variables
        run: cp .env.example .env

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: mise run db:generate

      - name: Check formatting, lint, and types
        run: mise run check

      - name: Install Playwright browser for DOM and browser tests
        run: pnpm exec playwright install --with-deps chromium

      - name: Unit and contract tests
        run: mise run test -- --unit

      - name: Database integration tests on the shared disposable database
        run: mise run test -- --db

      - name: Verify collected lift ticket data against official expectations
        run: LIFT_TICKET_DATA_ROOT=src/private/data/lift-ticket mise run test -- --unit src/features/lift-ticket/utils/uiContract.test.ts

      - name: Reject schema changes missing a migration
        run: pnpm prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

      - name: Validate deployment scripts
        run: |
          for script in scripts/ops/*.sh; do bash -n "$script" || exit; done
          python3 -m py_compile scripts/ops/verify-deployment-migration.py
          docker compose config --quiet
          git diff --check

      - name: Browser workflows against the isolated production build
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          API_BASE_URL: ''
          AUTH_URL: http://127.0.0.1:3001
          AUTH_SECRET: ephemeral-browser-test-only
          DISABLE_CRAWLER_SCHEDULER: 'true'
          DISABLE_EDIT_REQUEST_JOBS: 'true'
          DISABLE_COMMUNITY_MODERATION: 'true'
          RUSUTSU_DIST_DIR: .next-qa
          RUSUTSU_CSP_ENFORCE: 'true'
          OFFLINE_TEST_URL: http://127.0.0.1:3001/rusutsu
          OFFLINE_TEST_FIXTURE_TILES: '1'
          OFFLINE_TEST_HEADLESS: 'false'
          RUSUTSU_BROWSER_DISPOSABLE_DB: 'true'
          RUSUTSU_BROWSER_AUTH_SECRET: ephemeral-browser-test-only
          RUSUTSU_BROWSER_ADMIN_ID: browser-test-admin
        run: |
          docker exec -i "$POSTGRES_CONTAINER" psql -U rusutsu_ci -d rusutsu_test_1 < scripts/testBrowserFixtures.sql
          mise run build
          HOSTNAME=127.0.0.1 PORT=3001 mise exec -- node .next-qa/standalone/server.js &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --silent --fail --max-time 3 --output /dev/null "$OFFLINE_TEST_URL"; then break; fi
            if ! kill -0 "$server" || [ "$attempt" -eq 30 ]; then exit 1; fi
            sleep 1
          done
          xvfb-run -a mise run test -- --browser

  build-and-push:
    name: Build and Push Image
    needs: ci-checks
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.rollback_image_sha == '')) && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # main
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_TOKEN }}

      - name: Setup mise
        uses: jdx/mise-action@bfe96ab3315135bc9f7bf94c40e84f9f5efed861 # main
        with:
          install: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@5138f26214adf9d69718655df70f66d2b3c81db3 # master

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bf8388060db527dff14f48b6a5fdbe70763c1213 # master
        with:
          driver-opts: image=moby/buildkit:latest@sha256:baf6138eb8c37644800c7c913fba051e840ebb9ba13eaf92d92ef9a1712d0b4c

      - name: Log in to the Container registry
        uses: docker/login-action@d0b8297dd55199249f38268efae35fcb03f75aab # master
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build release image
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --build-arg "RUSUTSU_CSP_ENFORCE=${{ vars.RUSUTSU_CSP_ENFORCE == 'true' }}" \
            --load \
            --tag "${{ env.REGISTRY }}/babcs2035/rusutsu:latest" \
            --tag "${{ env.REGISTRY }}/babcs2035/rusutsu:${{ github.sha }}" \
            --cache-from=type=gha \
            --cache-to=type=gha,mode=max \
            .

      - name: Verify release migrations against disposable databases
        run: |
          docker pull postgres:16-alpine@sha256:1d5b02d3a9941fbd52437db4107f8c52d6297dac553ca1e5c299ebb3756b4857
          docker tag postgres:16-alpine@sha256:1d5b02d3a9941fbd52437db4107f8c52d6297dac553ca1e5c299ebb3756b4857 postgres:16-alpine
          mise exec uv@0.7.10 -- uv run --no-project scripts/ops/verify-deployment-migration.py --image "${{ env.REGISTRY }}/babcs2035/rusutsu:${{ github.sha }}"

      - name: Push the verified release image
        run: |
          docker push "${{ env.REGISTRY }}/babcs2035/rusutsu:${{ github.sha }}"
          docker push "${{ env.REGISTRY }}/babcs2035/rusutsu:latest"

  deploy:
    name: Deploy Image to VPS
    runs-on: ubuntu-latest
    needs: [ci-checks, build-and-push]
    if: >-
      !cancelled() && needs.ci-checks.result == 'success' &&
      ((inputs.rollback_image_sha == '' && needs.build-and-push.result == 'success') ||
      (inputs.rollback_image_sha != '' && needs.build-and-push.result == 'skipped')) &&
      github.ref == 'refs/heads/main'
    outputs:
      image-cleanup-outcome: ${{ steps.image-cleanup.outcome }}
    env:
      DEPLOY_IMAGE_TAG: ${{ inputs.rollback_image_sha || github.sha }}
      ROLLBACK_IMAGE_SHA: ${{ inputs.rollback_image_sha }}
      INITIALIZE_CANONICAL_DATA: ${{ inputs.rollback_image_sha != '' && 'false' || (inputs.initialize_data == true || vars.INITIALIZE_CANONICAL_DATA == 'true') }}
      ENABLE_CRAWL_LATEST_SCHEDULER: ${{ vars.ENABLE_CRAWL_LATEST_SCHEDULER != 'false' }}
      GHCR_DEPLOY_TOKEN: ${{ secrets.GHCR_DEPLOY_TOKEN }}
      GHCR_DEPLOY_USER: ${{ github.actor }}
      DEPLOY_TARGET: ${{ secrets.DEPLOY_TARGET }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # main
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_TOKEN }}

      - name: Setup Tailscale
        uses: tailscale/github-action@15aab698c4bc2ba4baecf36031adbc296b594f36 # main
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Setup mise for deployment settings
        uses: jdx/mise-action@bfe96ab3315135bc9f7bf94c40e84f9f5efed861 # main
        with:
          install: true

      - name: Prepare production settings from GitHub
        env:
          API_BEARER_TOKEN: ${{ secrets.API_BEARER_TOKEN }}
          API_BASE_URL: ${{ vars.API_BASE_URL || secrets.API_BASE_URL }}
          # Optional: otherwise preserve settings from the existing app.
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          COMMUNITY_MODERATION_URL: ${{ vars.COMMUNITY_MODERATION_URL }}
          COMMUNITY_MODERATION_TOKEN: ${{ secrets.COMMUNITY_MODERATION_TOKEN }}
          COMMUNITY_MODERATION_MODEL: ${{ vars.COMMUNITY_MODERATION_MODEL }}
          CONTRIBUTION_TRUST_PROXY: ${{ vars.CONTRIBUTION_TRUST_PROXY }}
        run: mise exec -- node scripts/ops/production-settings.ts

      - name: Deploy package via SCP
        uses: appleboy/scp-action@7e85c2e09aa21988492acd66466b5d68bda49e2b # master
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          target: ${{ secrets.DEPLOY_TARGET }}
          source: "docker-compose.production.yml,scripts/ops,public/map-sw.js"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@c4f70287fc37c43b14b30b407224bbbc8e8c6327 # master
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          envs: DEPLOY_IMAGE_TAG,ROLLBACK_IMAGE_SHA,INITIALIZE_CANONICAL_DATA,ENABLE_CRAWL_LATEST_SCHEDULER,GHCR_DEPLOY_TOKEN,GHCR_DEPLOY_USER,DEPLOY_TARGET,RUSUTSU_SETTINGS_B64
          command_timeout: 30m
          script: |
            set -eu
            # A quoted variable does not expand ~/ like the SCP target does.
            case "${DEPLOY_TARGET:-}" in
              '') echo 'DEPLOY_TARGET is empty. Set the deployment directory in GitHub Secrets.' >&2; exit 1 ;;
              '~') DEPLOY_TARGET="$HOME" ;;
              '~/'*) DEPLOY_TARGET="$HOME/${DEPLOY_TARGET#\~/}" ;;
              '$HOME/'*) DEPLOY_TARGET="$HOME/${DEPLOY_TARGET#\$HOME/}" ;;
              '${HOME}/'*) DEPLOY_TARGET="$HOME/${DEPLOY_TARGET#\$\{HOME\}/}" ;;
            esac
            if ! cd -- "$DEPLOY_TARGET" 2>/dev/null; then
              echo 'DEPLOY_TARGET directory is unavailable. Check the VPS deployment path in GitHub Secrets; use an absolute path or ~/directory.' >&2
              exit 1
            fi
            if [ ! -f scripts/ops/deploy.sh ] || [ ! -f docker-compose.production.yml ]; then
              echo 'Deployment package is missing from DEPLOY_TARGET. Check the SCP step and deployment path.' >&2
              exit 1
            fi
            printf '%s' "$GHCR_DEPLOY_TOKEN" | docker login ghcr.io -u "$GHCR_DEPLOY_USER" --password-stdin
            unset GHCR_DEPLOY_TOKEN
            bash scripts/ops/deploy.sh

      - name: Prune dangling Docker images
        id: image-cleanup
        continue-on-error: true
        uses: appleboy/ssh-action@c4f70287fc37c43b14b30b407224bbbc8e8c6327 # master
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            set -eu
            docker image prune --force

      - name: Report image cleanup failure
        if: steps.image-cleanup.outcome == 'failure'
        run: echo '::warning title=Image cleanup failed::Deployment succeeded; obsolete image cleanup needs attention.'

  image-cleanup-notification:
    name: Report Image Cleanup Failure
    runs-on: ubuntu-latest
    needs: deploy
    if: needs.deploy.outputs.image-cleanup-outcome == 'failure'
    steps:
      - name: Fail this notification job so GitHub sends the standard failure notification
        run: |
          echo 'Deployment succeeded, but Docker image prune failed.'
          echo 'Review the Deploy Image to VPS logs before retrying cleanup.'
          exit 1
