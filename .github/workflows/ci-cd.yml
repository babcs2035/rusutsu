name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      initialize_data:
        description: "Run the one-time canonical documents and shortName imports"
        type: boolean
        default: false
      force_database_backup:
        description: "Require a backup for an explicit bulk database operation"
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io

jobs:
  ci-checks:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rusutsu_ci
          POSTGRES_PASSWORD: ephemeral_ci_only
          POSTGRES_DB: rusutsu_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rusutsu_ci -d rusutsu_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://rusutsu_ci:ephemeral_ci_only@localhost:5432/rusutsu_ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@main
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_TOKEN }}

      - name: Setup mise
        uses: jdx/mise-action@main
        with:
          install: true

      - name: Prepare environment variables
        run: cp .env.example .env

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma generate

      - name: Run Format & Lint Check with Biome
        run: pnpm biome ci ./src ./scripts

      - name: Run Type Check
        run: pnpm tsc --noEmit

      - name: Unit and contract tests
        run: node scripts/runTests.mjs

      - name: Apply migrations to disposable CI database
        run: pnpm prisma migrate deploy

      - name: Reject schema changes missing a migration
        run: pnpm prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

      - name: Validate deployment scripts
        run: |
          bash -n scripts/ops/common.sh scripts/ops/backup-database.sh scripts/ops/deploy.sh scripts/ops/restore-backup-test.sh
          python3 -m py_compile scripts/ops/build-db-manifest.py
          docker compose config --quiet
          git diff --check

  build-and-push:
    name: Build and Push Image
    needs: ci-checks
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@main
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_TOKEN }}

      - name: Setup mise
        uses: jdx/mise-action@main
        with:
          install: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@master

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@master
        with:
          driver-opts: image=moby/buildkit:latest

      - name: Log in to the Container registry
        uses: docker/login-action@master
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --push \
            --tag "${{ env.REGISTRY }}/babcs2035/rusutsu:latest" \
            --tag "${{ env.REGISTRY }}/babcs2035/rusutsu:${{ github.sha }}" \
            --cache-from=type=gha \
            --cache-to=type=gha,mode=max \
            .

  deploy:
    name: Deploy Image to VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    concurrency:
      group: rusutsu-production-operations
      cancel-in-progress: false
    env:
      DEPLOY_IMAGE_TAG: ${{ github.sha }}
      INITIALIZE_CANONICAL_DATA: ${{ inputs.initialize_data == true || vars.INITIALIZE_CANONICAL_DATA == 'true' }}
      FORCE_DATABASE_BACKUP: ${{ inputs.force_database_backup == true }}
      ENABLE_CRAWL_LATEST_SCHEDULER: ${{ vars.ENABLE_CRAWL_LATEST_SCHEDULER == 'true' }}
      GHCR_DEPLOY_TOKEN: ${{ secrets.GHCR_DEPLOY_TOKEN }}
      GHCR_DEPLOY_USER: ${{ github.actor }}
      DEPLOY_TARGET: ${{ secrets.DEPLOY_TARGET }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@main
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_TOKEN }}

      - name: Setup Tailscale
        uses: tailscale/github-action@main
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Prepare production settings from GitHub
        env:
          INTERNAL_DATA_API_ADMIN_TOKEN: ${{ secrets.INTERNAL_DATA_API_ADMIN_TOKEN }}
          INTERNAL_DATA_API_CRAWLER_TOKEN: ${{ secrets.INTERNAL_DATA_API_CRAWLER_TOKEN }}
          INTERNAL_DATA_API_DIAGNOSTICS_TOKEN: ${{ secrets.INTERNAL_DATA_API_DIAGNOSTICS_TOKEN }}
          DATA_API_BASE_URL: ${{ vars.DATA_API_BASE_URL || secrets.DATA_API_BASE_URL }}
          # Optional: otherwise preserve settings from the existing app.
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
        run: node scripts/ops/production-settings.mjs

      - name: Fingerprint explicit database-changing paths
        run: python3 scripts/ops/build-db-manifest.py > db-change-manifest.sha256

      - name: Deploy package via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          target: ${{ secrets.DEPLOY_TARGET }}
          source: "docker-compose.production.yml,db-change-manifest.sha256,scripts/ops"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          envs: DEPLOY_IMAGE_TAG,INITIALIZE_CANONICAL_DATA,FORCE_DATABASE_BACKUP,ENABLE_CRAWL_LATEST_SCHEDULER,GHCR_DEPLOY_TOKEN,GHCR_DEPLOY_USER,DEPLOY_TARGET,RUSUTSU_SETTINGS_B64
          command_timeout: 30m
          script: |
            set -eu
            # A quoted variable does not expand ~/ like the SCP target does.
            case "${DEPLOY_TARGET:-}" in
              '') echo 'DEPLOY_TARGET is empty. Set the deployment directory in GitHub Secrets.' >&2; exit 1 ;;
              '~') DEPLOY_TARGET="$HOME" ;;
              '~/'*) DEPLOY_TARGET="$HOME/${DEPLOY_TARGET#\~/}" ;;
              '$HOME/'*) DEPLOY_TARGET="$HOME/${DEPLOY_TARGET#\$HOME/}" ;;
              '${HOME}/'*) DEPLOY_TARGET="$HOME/${DEPLOY_TARGET#\$\{HOME\}/}" ;;
            esac
            if ! cd -- "$DEPLOY_TARGET" 2>/dev/null; then
              echo 'DEPLOY_TARGET directory is unavailable. Check the VPS deployment path in GitHub Secrets; use an absolute path or ~/directory.' >&2
              exit 1
            fi
            if [ ! -f scripts/ops/deploy.sh ] || [ ! -f docker-compose.production.yml ] || [ ! -f db-change-manifest.sha256 ]; then
              echo 'Deployment package is missing from DEPLOY_TARGET. Check the SCP step and deployment path.' >&2
              exit 1
            fi
            printf '%s' "$GHCR_DEPLOY_TOKEN" | docker login ghcr.io -u "$GHCR_DEPLOY_USER" --password-stdin
            unset GHCR_DEPLOY_TOKEN
            bash scripts/ops/deploy.sh
