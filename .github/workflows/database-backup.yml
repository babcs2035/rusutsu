name: Daily database backup

on:
  schedule:
    # Every day at 01:15 JST, regardless of repository pushes.
    - cron: "15 16 * * *"
  workflow_dispatch:
    inputs:
      test_restore:
        description: "Also verify restoration into a temporary DB on the VPS"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    concurrency:
      group: rusutsu-production-operations
      cancel-in-progress: false
    env:
      DEPLOY_TARGET: ${{ secrets.DEPLOY_TARGET }}
      TEST_RESTORE: ${{ inputs.test_restore == true }}
    steps:
      - name: Setup Tailscale
        uses: tailscale/github-action@main
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      # Use the CI-validated operations package installed by the deployment workflow.
      - name: Back up and verify VPS-local copy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          envs: DEPLOY_TARGET,TEST_RESTORE
          command_timeout: 30m
          script: |
            set -eu
            # Keep path handling consistent with the deployment workflow.
            case "${DEPLOY_TARGET:-}" in
              '') echo 'DEPLOY_TARGET is empty. Set the deployment directory in GitHub Secrets.' >&2; exit 1 ;;
              '~') DEPLOY_TARGET="$HOME" ;;
              '~/'*) DEPLOY_TARGET="$HOME/${DEPLOY_TARGET#\~/}" ;;
              '$HOME/'*) DEPLOY_TARGET="$HOME/${DEPLOY_TARGET#\$HOME/}" ;;
              '${HOME}/'*) DEPLOY_TARGET="$HOME/${DEPLOY_TARGET#\$\{HOME\}/}" ;;
            esac
            if ! cd -- "$DEPLOY_TARGET" 2>/dev/null; then
              echo 'DEPLOY_TARGET directory is unavailable. Check the VPS deployment path in GitHub Secrets; use an absolute path or ~/directory.' >&2
              exit 1
            fi
            if [ ! -f scripts/ops/backup-database.sh ] || [ ! -f scripts/ops/restore-backup-test.sh ]; then
              echo 'Backup scripts are missing from DEPLOY_TARGET. Complete the CI/CD deployment first.' >&2
              exit 1
            fi
            bash scripts/ops/backup-database.sh
            if [ "$TEST_RESTORE" = true ]; then
              bash scripts/ops/restore-backup-test.sh
            fi
